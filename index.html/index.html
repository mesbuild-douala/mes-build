<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MES BUILD - Devis + Plan 2D Cameroun</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0f172a;color:#fff;padding:12px}
header{background:#f59e0b;color:#111;padding:14px;border-radius:12px;text-align:center}header h1{margin:0;font-size:22px}
.card{background:#fff;color:#111;border-radius:14px;padding:14px;margin-top:12px}
h2{margin:0 0 10px;font-size:17px}label{font-size:13px;font-weight:bold;display:block;margin-top:10px}
input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;margin-top:4px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#f59e0b;font-weight:bold;font-size:16px;margin-top:12px}
.result{background:#ecfdf5;border:2px solid #10b981;border-radius:12px;padding:12px;margin-top:12px;font-size:15px;line-height:1.7}
canvas{width:100%;background:#fff;border:2px solid #111;border-radius:10px;margin-top:10px}
</style></head><body>
<header><h1>🏗️ MES BUILD</h1><p>Devis Instantané + Plan 2D - Cameroun</p></header>
<div class="card"><h2>📋 1. Devis Instantané</h2>
<label>Ville</label><select id="ville">
<option value="85000">Douala - 85 000 FCFA / m²</option>
<option value="80000">Yaoundé - 80 000 FCFA / m²</option>
<option value="75000">Bafoussam - 75 000 FCFA / m²</option>
<option value="70000">Garoua - 70 000 FCFA / m²</option>
<option value="72000">Bamenda - 72 000 FCFA / m²</option>
<option value="68000">Ngaoundéré - 68 000 FCFA / m²</option>
<option value="65000">Maroua - 65 000 FCFA / m²</option>
<option value="70000">Bertoua - 70 000 FCFA / m²</option>
<option value="78000">Kribi - 78 000 FCFA / m²</option>
<option value="75000">Limbe - 75 000 FCFA / m²</option>
</select>
<label>Type</label><select id="type"><option value="1">Maison simple</option><option value="1.25">Villa Moderne x1.25</option><option value="1.5">Villa Luxe / R+1 x1.5</option></select>
<div class="grid"><div><label>Surface (m²)</label><input id="surf" type="number" value="100"></div><div><label>Chambres</label><input id="ch" type="number" value="3"></div></div>
<button onclick="calcul()">CALCULER MON DEVIS 💰</button><div id="res" class="result" style="display:none"></div></div>
<div class="card"><h2>📐 2. Plan 2D</h2>
<div class="grid"><div><label>Longueur (m)</label><input id="long" type="number" value="12"></div><div><label>Largeur (m)</label><input id="larg" type="number" value="9"></div></div>
<button onclick="plan()" style="background:#111;color:#fff">GÉNÉRER LE PLAN 2D 🏠</button><canvas id="c" width="600" height="420"></canvas></div>
<div class="card"><button onclick="wa()">COMMANDER SUR WHATSAPP ✅</button></div>
<script>
let total=0,villeTxt="";function fmt(n){return n.toLocaleString('fr-FR')+" FCFA"}
function calcul(){let p=+document.getElementById('ville').value;villeTxt=document.getElementById('ville').options[document.getElementById('ville').selectedIndex].text;let coef=+document.getElementById('type').value;let s=+document.getElementById('surf').value;let ch=+document.getElementById('ch').value;total=Math.round(p*coef*s);let r=document.getElementById('res');r.style.display='block';r.innerHTML=`<b>${villeTxt}</b><br>Surface: ${s} m² - ${ch} chambres<br><hr><b>TOTAL: ${fmt(total)}</b><br>✅ Devis gratuit`;}
function plan(){let L=+document.getElementById('long').value,W=+document.getElementById('larg').value;let cv=document.getElementById('c'),x=cv.getContext('2d');x.clearRect(0,0,600,420);x.lineWidth=3;x.strokeRect(20,20,560,340);x.font='bold 16px Arial';x.fillStyle='#111';x.fillText(`PLAN ${L}m x ${W}m = ${L*W} m²`,180,45);x.fillStyle='#fef3c7';x.fillRect(20,60,300,200);x.strokeRect(20,60,300,200);x.fillText('SALON',130,160);x.fillStyle='#dcfce7';x.fillRect(320,60,260,140);x.strokeRect(320,60,260,140);x.fillText('CUISINE',400,130);x.fillStyle='#dbeafe';x.fillRect(320,200,260,60);x.strokeRect(320,200,260,60);x.fillText('SDB',420,235);x.fillStyle='#fce7f3';x.fillRect(20,260,270,100);x.strokeRect(20,260,270,100);x.fillText('CHAMBRE 1',90,315);x.fillStyle='#fef9c3';x.fillRect(290,260,290,100);x.strokeRect(290,260,290,100);x.fillText('CHAMBRE 2',380,315);}
function wa(){if(!total)calcul();let msg=`Bonjour MES BUILD, devis: ${villeTxt} - ${document.getElementById('surf').value} m2 - Total ${fmt(total)}`;window.open('https://wa.me/237600000000?text='+encodeURIComponent(msg));}
calcul();plan();
</script></body></html>
